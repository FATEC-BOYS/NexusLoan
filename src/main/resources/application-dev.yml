spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexusloan}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      show-details: always

