spring:
  application:
    name: nexus-loan
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

nexusloan:
  security:
    jwt:
      # Chave HMAC (mínimo 32 bytes). Obrigatória: não existe valor padrão.
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:PT1H}
      issuer: ${JWT_ISSUER:nexus-loan}
  loan:
    # Empréstimo é reprovado quando amount > monthlyIncome * multiplicador.
    max-income-multiplier: ${LOAN_MAX_INCOME_MULTIPLIER:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: '@project.name@'
    description: '@project.description@'
    version: '@project.version@'
